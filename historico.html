<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>NewEnergy | Histórico</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

:root {

    --brand-primary:#1a365d;
    --brand-accent:#007aff;

    --bg-body:#f8fafc;
    --card-bg:#ffffff;

    --text-main:#1e293b;
    --text-muted:#64748b;

    --border:#e2e8f0;

    --danger:#e11d48;
    --success:#10b981;

    --shadow:
        0 10px 15px -3px rgba(0,0,0,.1);

}

* {
    box-sizing:border-box;
}

body {

    margin:0;

    font-family:'Inter',sans-serif;

    background:var(--bg-body);

    color:var(--text-main);

    display:flex;

    justify-content:center;

    padding:20px;

}

.card {

    background:var(--card-bg);

    border-radius:16px;

    padding:30px;

    width:100%;

    max-width:1100px;

    border:1px solid var(--border);

    box-shadow:var(--shadow);

}

header {

    border-left:6px solid var(--brand-primary);

    padding-left:20px;

    margin-bottom:25px;

}

header h1 {

    margin:0;

    font-size:26px;

    font-weight:800;

    color:var(--brand-primary);

    letter-spacing:-1px;

}

header p {

    margin:4px 0 0;

    color:var(--brand-accent);

    font-size:12px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1px;

}

.info-bar {

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    background:#f8fafc;

    border:1px solid var(--border);

    border-radius:12px;

    padding:14px 16px;

    margin-bottom:20px;

    flex-wrap:wrap;

}

.sensor-info {

    font-size:13px;

    color:var(--text-muted);

}

.sensor-info strong {

    color:var(--brand-primary);

}

.tabs {

    display:flex;

    background:#f1f5f9;

    padding:4px;

    border-radius:12px;

    margin-bottom:25px;

    gap:4px;

    flex-wrap:wrap;

}

.tab {

    flex:1;

    min-width:100px;

    padding:12px;

    text-align:center;

    border-radius:9px;

    cursor:pointer;

    font-size:12px;

    font-weight:600;

    color:var(--text-muted);

    transition:.3s;

}

.tab.active {

    background:white;

    color:var(--brand-primary);

    box-shadow:
        0 4px 6px -1px rgba(0,0,0,.05);

}

.chart-container {

    background:#fff;

    border-radius:12px;

    padding:15px;

    margin-bottom:30px;

    border:1px solid var(--border);

    height:380px;

}

#lista {

    max-height:500px;

    overflow-y:auto;

    padding-right:10px;

}

.data-divider {

    color:var(--brand-primary);

    font-size:11px;

    font-weight:800;

    margin:25px 0 12px;

    display:flex;

    align-items:center;

}

.data-divider::after {

    content:"";

    flex:1;

    height:1px;

    background:var(--border);

    margin-left:15px;

}

.item {

    background:#fff;

    padding:14px 18px;

    border-radius:10px;

    margin-bottom:8px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border:1px solid var(--border);

}

.item.alerta {

    border-left:4px solid var(--danger);

    background:#fff1f2;

}

.btn-group {

    display:flex;

    gap:15px;

    margin-top:30px;

}

.btn {

    flex:1;

    padding:16px;

    border:none;

    border-radius:12px;

    font-weight:700;

    cursor:pointer;

    font-size:14px;

}

.btn-pdf {

    background:var(--brand-primary);

    color:#fff;

}

.btn-pdf:disabled {

    background:#94a3b8;

    cursor:not-allowed;

}

.btn-back {

    background:#fff;

    color:var(--text-muted);

    border:1.5px solid var(--border);

}

.valor-critico {

    color:var(--danger)!important;

    font-weight:900;

}

.normal {

    color:var(--success);

    font-weight:800;

}

#lista::-webkit-scrollbar {

    width:5px;

}

#lista::-webkit-scrollbar-thumb {

    background:#cbd5e1;

    border-radius:10px;

}

.erro {

    background:#fff1f2;

    border:1px solid #fecdd3;

    color:#be123c;

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;

    font-size:13px;

}

@media(max-width:700px) {

    .card {
        padding:18px;
    }

    .chart-container {
        height:300px;
    }

    .btn-group {
        flex-direction:column;
    }

    .item {
        gap:10px;
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

<header>

    <h1>NEWENERGY</h1>

    <p>Sistema de Monitoramento</p>

</header>


<!-- =====================================================
     INFORMAÇÕES DO SENSOR
===================================================== -->

<div class="info-bar">

    <div class="sensor-info">

        Sensor:

        <strong id="sensorNome">
            Carregando...
        </strong>

    </div>


    <div class="sensor-info">

        <strong id="sensorLocal">

        </strong>

    </div>


    <div class="sensor-info">

        <strong id="sensorCliente">

    </div>

    <div

    >

        class="tab"

</div>

        Carregando histórico...

</div>


<!-- =====================================================
     BOTÕES

<div class="btn-group">

    <button
        class="btn btn-pdf"

<script>


// =====================================================
// FIREBASE NESTU-02
// =====================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyAHF7mVM9Yv71cnqG-C1_P7MfEj1hc6_Bs",

    authDomain:
        "nestu-02.firebaseapp.com",

    databaseURL:
        "https://nestu-02-default-rtdb.firebaseio.com",

    projectId:
        "nestu-02",

    storageBucket:
        "nestu-02.firebasestorage.app",

    messagingSenderId:
        "440418278168",

    appId:
        "1:440418278168:web:15c519eb00200a33435c6d"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.database();


// =====================================================
// VARIÁVEIS
// =====================================================

let myChart = null;

let globalData = [];

let sensorID = null;

let sensorConfig = null;


let limites = {

    tMin:0,

    tMax:40,

    hMin:0,

    hMax:100

};


// =====================================================
// SENSOR DA URL
// =====================================================

const parametros =
    new URLSearchParams(
        window.location.search
    );


sensorID =
    parametros.get("id");


// =====================================================
// INICIALIZAÇÃO
// =====================================================

if (!sensorID) {

    document.getElementById(
        "sensorNome"
    ).textContent =
        "Nenhum sensor selecionado";


    document.getElementById(
        "lista"
    ).innerHTML = `

        <div class="erro">

            Nenhum sensor foi informado.

            <br><br>

            Abra o histórico através do
            painel do sensor.

        </div>

    `;

}
else {

    carregarSensor();

}


// =====================================================
// CARREGAR SENSOR
// =====================================================

async function carregarSensor() {

    try {

        const snapshot =
            await db.ref(
                `central_sensores/${sensorID}`
            )
            .once("value");


        if (!snapshot.exists()) {

            throw new Error(
                `O sensor ${sensorID} não existe em central_sensores.`
            );

        }


        sensorConfig =
            snapshot.val();


        document.getElementById(
            "sensorNome"
        ).textContent =
            sensorID;


        document.getElementById(
            "sensorLocal"
        ).textContent =
            sensorConfig.nome || "--";


        document.getElementById(
            "sensorCliente"
        ).textContent =
            sensorConfig.clientID || "--";


        // =================================================
        // LIMITES
        // =================================================

        const limiteSnap =
            await db.ref(
                "config_alertas"
            )
            .once("value");


        if (limiteSnap.exists()) {

            limites = {

                ...limites,

                ...limiteSnap.val()

            };

        }


        fetchData("diario");

    }

    catch(error) {

        console.error(error);


        document.getElementById(
            "erroFirebase"
        ).innerHTML = `

            <div class="erro">

                <b>Erro ao carregar o sensor.</b>

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


// =====================================================
// BUSCAR HISTÓRICO
// =====================================================

async function fetchData(periodo) {

    const listaDiv =
        document.getElementById(
            "lista"
        );


    listaDiv.innerHTML = `

        <p style="text-align:center;padding:40px;">
            Sincronizando dados...
        </p>

    `;


    globalData = [];


    if (myChart) {

        myChart.destroy();

        myChart = null;

    }


    try {

        // =================================================
        // BUSCA SOMENTE O HISTÓRICO
        // =================================================

        const snapshot =
            await db.ref(
                "historico/diario"
            )
            .once("value");


        if (!snapshot.exists()) {

            mostrarSemDados();

            return;

        }


        const base =
            snapshot.val();


        const agora =
            new Date();


        const inicioHoje =
            new Date(

                agora.getFullYear(),

                agora.getMonth(),

                agora.getDate(),

                0,
                0,
                0,
                0

            ).getTime();


        const seteDiasAtras =
            agora.getTime()
            -
            (
                7 *
                24 *
                60 *
                60 *
                1000
            );


        // =================================================
        // PERCORRER OS DIAS
        // =================================================

        Object.keys(base).forEach(
            dataKey => {

                const dadosDia =
                    base[dataKey];


                if (
                    !dadosDia ||
                    typeof dadosDia !== "object"
                ) {

                    return;

                }


                // =================================================
                // PROCURAR O SENSOR PELO ID
                //
                // Exemplo:
                //
                // historico
                //  diario
                //   2026-08-28
                //    SENSOR_02
                //     timestamp
                //      temp
                //      hum
                // =================================================

                if (
                    dadosDia[sensorID]
                ) {

                    const registros =
                        dadosDia[sensorID];


                    Object.keys(registros)
                    .forEach(
                        ts => {

                            processarRegistro(

                                ts,

                                registros[ts],

                                periodo,

                                agora,

                                inicioHoje,

                                seteDiasAtras

                            );

                        }
                    );

                }


                // =================================================
                // COMPATIBILIDADE COM ESTRUTURA:
                //
                // dia
                //   timestamp
                //      temp
                //      hum
                //
                // Essa estrutura só será utilizada se o
                // histórico não tiver identificação de sensor.
                // =================================================

                else {

                    Object.keys(dadosDia)
                    .forEach(
                        chave => {

                            const registro =
                                dadosDia[chave];


                            if (
                                chave === sensorID
                            ) {

                                return;

                            }


                            if (
                                registro &&
                                typeof registro === "object" &&
                                (
                                    registro.temp !== undefined
                                    ||
                                    registro.hum !== undefined
                                )
                            ) {

                                processarRegistro(

                                    chave,

                                    registro,

                                    periodo,

                                    agora,

                                    inicioHoje,

                                    seteDiasAtras

                                );

                            }

                        }
                    );

                }

            }
        );


        // =================================================
        // REMOVER DUPLICADOS
        // =================================================

        const mapa =
            new Map();


        globalData.forEach(
            item => {

                const chave =
                    `${item.ts}_${item.temp}_${item.hum}`;


                mapa.set(
                    chave,
                    item
                );

            }
        );


        globalData =
            Array.from(
                mapa.values()
            );


        // =================================================
        // ORDENAR
        // =================================================

        globalData.sort(
            (a,b) =>
                b.ts - a.ts
        );


        // =================================================
        // SEM DADOS
        // =================================================

        if (
            globalData.length === 0
        ) {

            mostrarSemDados();

            return;

        }


        // =================================================
        // RENDERIZAR
        // =================================================

        renderUI();

        renderChart(periodo);

    }

    catch(error) {

        console.error(
            "Erro no histórico:",
            error
        );


        listaDiv.innerHTML = `

            <div class="erro">

                <b>Erro ao carregar histórico.</b>

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


// =====================================================
// PROCESSAR REGISTRO
// =====================================================

function processarRegistro(

    ts,

    registro,

    periodo,

    agora,

    inicioHoje,

    seteDiasAtras

) {

    if (
        !registro ||
        typeof registro !== "object"
    ) {

        return;

    }


    const temp =
        Number(
            registro.temp
        );


    const hum =
        Number(
            registro.hum
        );


    if (
        !Number.isFinite(temp) ||
        !Number.isFinite(hum)
    ) {

        return;

    }


    let timestamp =
        Number(ts);


    if (
        !Number.isFinite(timestamp)
    ) {

        return;

    }


    // =================================================
    // CASO O TIMESTAMP VENHA EM MILISSEGUNDOS
    // =================================================

    if (
        timestamp > 100000000000
    ) {

        timestamp =
            Math.floor(
                timestamp / 1000
            );

    }


    const tsM =
        timestamp * 1000;


    const data =
        new Date(
            tsM
        );


    if (
        isNaN(
            data.getTime()
        )
    ) {

        return;

    }


    let incluir =
        false;


    // =================================================
    // HOJE
    // =================================================

    if (
        periodo === "diario"
        &&
        tsM >= inicioHoje
    ) {

        incluir = true;

    }


    // =================================================
    // ÚLTIMOS 7 DIAS
    // =================================================

    else if (
        periodo === "semanal"
        &&
        tsM >= seteDiasAtras
    ) {

        incluir = true;

    }


    // =================================================
    // MÊS ATUAL
    // =================================================

    else if (
        periodo === "mensal"
        &&
        data.getMonth()
            === agora.getMonth()
        &&
        data.getFullYear()
            === agora.getFullYear()
    ) {

        incluir = true;

    }


    // =================================================
    // ANO ATUAL
    // =================================================

    else if (
        periodo === "anual"
        &&
        data.getFullYear()
            === agora.getFullYear()
    ) {

        incluir = true;

    }


    if (!incluir) {

        return;

    }


    globalData.push({

        ts:timestamp,

        temp:temp,

        hum:hum,

        data:
            data.toLocaleDateString(
                "pt-BR"
            ),

        hora:
            data.toLocaleTimeString(
                "pt-BR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )

    });

}


// =====================================================
// SEM DADOS
// =====================================================

function mostrarSemDados() {

    document.getElementById(
        "lista"
    ).innerHTML = `

        <p style="text-align:center;padding:40px;">

            Nenhum registro encontrado
            para este período.

        </p>

    `;

}


// =====================================================
// RENDERIZAR LISTA
// =====================================================

function renderUI() {

    const listaDiv =
        document.getElementById(
            "lista"
        );


    listaDiv.innerHTML = "";


    let ultimaData = "";


    globalData.forEach(
        d => {

            if (
                d.data !== ultimaData
            ) {

                const divisor =
                    document.createElement(
                        "div"
                    );


                divisor.className =
                    "data-divider";


                divisor.innerHTML =
                    `<span>${d.data}</span>`;


                listaDiv.appendChild(
                    divisor
                );


                ultimaData =
                    d.data;

            }


            const erroTemp =
                d.temp > limites.tMax
                ||
                d.temp < limites.tMin;


            const erroHum =
                d.hum > limites.hMax
                ||
                d.hum < limites.hMin;


            const erro =
                erroTemp ||
                erroHum;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                `item ${erro ? "alerta" : ""}`;


            item.innerHTML = `

                <div>

                    <b>
                        ${d.hora}
                    </b>

                </div>


                <div
                    style="
                        display:flex;
                        gap:20px;
                        text-align:right;
                    "
                >

                    <div>

                        <small
                            style="
                                display:block;
                                font-size:8px;
                                color:var(--text-muted)
                            "
                        >
                            TEMP
                        </small>


                        <span
                            class="${
                                erroTemp
                                ?
                                "valor-critico"
                                :
                                ""
                            }"
                        >

                            ${d.temp.toFixed(1)}°C

                        </span>

                    </div>


                    <div>

                        <small
                            style="
                                display:block;
                                font-size:8px;
                                color:var(--text-muted)
                            "
                        >
                            UMID
                        </small>


                        <span
                            class="${
                                erroHum
                                ?
                                "valor-critico"
                                :
                                ""
                            }"
                        >

                            ${d.hum.toFixed(1)}%

                        </span>

                    </div>


                    <div>

                        <small
                            style="
                                display:block;
                                font-size:8px;
                                color:var(--text-muted)
                            "
                        >
                            STATUS
                        </small>


                        <span
                            class="${
                                erro
                                ?
                                "valor-critico"
                                :
                                "normal"
                            }"
                        >

                            ${
                                erro
                                ?
                                "ALERTA"
                                :
                                "NORMAL"
                            }

                        </span>

                    </div>

                </div>

            `;


            listaDiv.appendChild(
                item
            );

        }
    );

}


// =====================================================
// GRÁFICO
// =====================================================

function renderChart(periodo) {

    const dados =
        [...globalData]
        .sort(
            (a,b) =>
                a.ts - b.ts
        );


    const ctx =
        document
        .getElementById(
            "mainChart"
        )
        .getContext(
            "2d"
        );


    const gradT =
        ctx.createLinearGradient(
            0,
            0,
            0,
            400
        );


    gradT.addColorStop(
        0,
        "rgba(244,63,94,.2)"
    );


    gradT.addColorStop(
        1,
        "rgba(244,63,94,0)"
    );


    const gradH =
        ctx.createLinearGradient(
            0,
            0,
            0,
            400
        );


    gradH.addColorStop(
        0,
        "rgba(0,122,255,.2)"
    );


    gradH.addColorStop(
        1,
        "rgba(0,122,255,0)"
    );


    myChart =
        new Chart(
            ctx,
            {

                type:"line",

                data:{

                    labels:

                        dados.map(
                            d => {

                                if (
                                    periodo === "diario"
                                    ||
                                    periodo === "semanal"
                                ) {

                                    return `${
                                        d.data.split("/")[0]
                                    }/${
                                        d.data.split("/")[1]
                                    } ${d.hora}`;

                                }

                                return d.data;

                            }
                        ),

                    datasets:[

                        {

                            label:
                                "Temperatura (°C)",

                            data:
                                dados.map(
                                    d =>
                                        d.temp
                                ),

                            borderColor:
                                "#f43f5e",

                            backgroundColor:
                                gradT,

                            fill:true,

                            tension:.4,

                            pointRadius:
                                dados.length > 50
                                ?
                                0
                                :
                                2,

                            borderWidth:2

                        },


                        {

                            label:
                                "Umidade (%)",

                            data:
                                dados.map(
                                    d =>
                                        d.hum
                                ),

                            borderColor:
                                "#007aff",

                            backgroundColor:
                                gradH,

                            fill:true,

                            tension:.4,

                            pointRadius:
                                dados.length > 50
                                ?
                                0
                                :
                                2,

                            borderWidth:2

                        }

                    ]

                },


                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    interaction:{

                        mode:"index",

                        intersect:false

                    },


                    plugins:{

                        legend:{

                            labels:{

                                font:{

                                    family:"Inter",

                                    weight:"bold"

                                }

                            }

                        }

                    },


                    scales:{

                        x:{

                            ticks:{

                                autoSkip:true,

                                maxTicksLimit:12

                            }

                        },


                        y:{

                            grid:{

                                color:"#f1f5f9"

                            }

                        }

                    }

                }

            }
        );

}


// =====================================================
// EXPORTAR PDF
// =====================================================

async function exportarPDF() {

    if (
        globalData.length === 0
    ) {

        alert(
            "Não existem dados para exportar."
        );

        return;

    }


    const {
        jsPDF
    } =
        window.jspdf;


    const doc =
        new jsPDF();


    const btn =
        document.getElementById(
            "btnPdf"
        );


    const aba =
        document
        .querySelector(
            ".tab.active"
        )
        .innerText;


    btn.disabled =
        true;


    const textoOriginal =
        btn.innerText;


    const linhasPorPagina =
        28;


    const totalPaginas =
        Math.max(
            1,
            Math.ceil(
                globalData.length /
                linhasPorPagina
            )
        );


    function header(pagina) {

        doc.setFillColor(
            26,
            54,
            93
        );


        doc.rect(
            0,
            0,
            210,
            38,
            "F"
        );


        doc.setTextColor(
            255,
            255,
            255
        );


        doc.setFont(
            "helvetica",
            "bold"
        );


        doc.setFontSize(
            22
        );


        doc.text(
            "NEWENERGY",
            15,
            16
        );


        doc.setFontSize(
            9
        );


        doc.setFont(
            "helvetica",
            "normal"
        );


        doc.text(
            "SISTEMA DE MONITORAMENTO",
            15,
            23
        );


        doc.setFontSize(
            8
        );


        doc.text(
            `SENSOR: ${sensorID}`,
            15,
            29
        );


        doc.text(
            `RELATÓRIO: ${aba.toUpperCase()}`,
            195,
            15,
            {
                align:"right"
            }
        );


        doc.text(
            `DATA: ${
                new Date()
                .toLocaleDateString("pt-BR")
            }`,
            195,
            21,
            {
                align:"right"
            }
        );


        doc.text(
            `PÁGINA: ${pagina} / ${totalPaginas}`,
            195,
            27,
            {
                align:"right"
            }
        );


        doc.setFillColor(
            0,
            122,
            255
        );


        doc.rect(
            0,
            38,
            210,
            1.2,
            "F"
        );

    }


    function tableHead(y) {

        doc.setFillColor(
            245,
            248,
            251
        );


        doc.rect(
            15,
            y - 6,
            180,
            10,
            "F"
        );


        doc.setDrawColor(
            200,
            210,
            220
        );


        doc.line(
            15,
            y + 4,
            195,
            y + 4
        );


        doc.setTextColor(
            26,
            54,
            93
        );


        doc.setFont(
            "helvetica",
            "bold"
        );


        doc.setFontSize(
            9
        );


        doc.text(
            "DATA / HORA",
            20,
            y
        );


        doc.text(
            "TEMPERATURA",
            78,
            y
        );


        doc.text(
            "UMIDADE",
            128,
            y
        );


        doc.text(
            "STATUS",
            172,
            y
        );


        return y + 10;

    }


    let pagina = 1;


    header(
        pagina
    );


    let y =
        tableHead(55);


    for (
        let i = 0;
        i < globalData.length;
        i++
    ) {

        const d =
            globalData[i];


        if (
            y > 280
        ) {

            doc.addPage();


            pagina++;


            header(
                pagina
            );


            y =
                tableHead(55);

        }


        const erroTemp =
            d.temp > limites.tMax
            ||
            d.temp < limites.tMin;


        const erroHum =
            d.hum > limites.hMax
            ||
            d.hum < limites.hMin;


        const erro =
            erroTemp ||
            erroHum;


        if (erro) {

            doc.setFillColor(
                255,
                241,
                242
            );


            doc.rect(
                15,
                y - 5,
                180,
                8,
                "F"
            );


            doc.setTextColor(
                225,
                29,
                72
            );


            doc.setFont(
                "helvetica",
                "bold"
            );

        }
        else {

            doc.setTextColor(
                51,
                65,
                85
            );


            doc.setFont(
                "helvetica",
                "normal"
            );

        }


        doc.setFontSize(8);


        doc.text(
            `${d.data} ${d.hora}`,
            20,
            y
        );


        doc.text(
            `${d.temp.toFixed(1)}°C`,
            83,
            y
        );


        doc.text(
            `${d.hum.toFixed(1)}%`,
            133,
            y
        );


        if (erro) {

            doc.setTextColor(
                225,
                29,
                72
            );


            doc.text(
                "ALERTA",
                172,
                y
            );

        }
        else {

            doc.setTextColor(
                16,
                185,
                129
            );


            doc.text(
                "NORMAL",
                172,
                y
            );

        }


        y += 8;


        if (
            i % 20 === 0
        ) {

            btn.innerText =
                `Gerando... ${
                    Math.round(
                        (i / globalData.length)
                        * 100
                    )
                }%`;


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1
                    )
            );

        }

    }


    doc.setFontSize(7);


    doc.setTextColor(
        148,
        163,
        184
    );


    doc.text(
        "NewEnergy Analytics - Monitoramento de Precisão",
        105,
        292,
        {
            align:"center"
        }
    );


    doc.save(
        `Relatorio_NewEnergy_${
            sensorID
        }_${
            aba.replace(
                / /g,
                "_"
            )
        }.pdf`
    );


    btn.disabled =
        false;


    btn.innerText =
        textoOriginal;

}

function voltar() {

    window.location.href =
        `painel.html?id=${
            encodeURIComponent(
                sensorID || ""
            )
        }`;

}

// ABAS
// =====================================================

document
.querySelectorAll(".tab")
.forEach(
    tab => {

        tab.addEventListener(
            "click",
            function() {

                document
                .querySelectorAll(".tab")
                .forEach(
                    x =>
                        x.classList.remove(
                            "active"
                        )
                );


                this.classList.add(
                    "active"
                );


                fetchData(
                    this.dataset.periodo
                );

            }
        );

    }
);


</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Leituras - NewEnergy</title>
    
    <!-- CSS Dependencies -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Chart.js & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 1.5rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
            text-decoration: none;
        }

        .btn:hover { opacity: 0.9; }
        .btn-secondary { background-color: var(--border-color); }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th { color: var(--text-muted); font-weight: 500; font-size: 0.875rem; }

        .erro {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="tituloSensor"><i class="fa-solid fa-chart-line"></i> Histórico de Leituras</h1>
        <div>
            <button class="btn btn-secondary" onclick="exportarPDF()"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
            <a href="index.html" class="btn"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        </div>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="filtrar('hoje', this)">Hoje</button>
        <button class="filter-btn" onclick="filtrar('7dias', this)">Últimos 7 dias</button>
        <button class="filter-btn" onclick="filtrar('tudo', this)">Todo o Histórico</button>
    </div>

    <div class="card">
        <div class="chart-container">
            <canvas id="historicoChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 16px;">Registros</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Data / Hora</th>
                        <th>Temperatura</th>
                        <th>Umidade</th>
                    </tr>
                </thead>
                <tbody id="listaHistorico">
                    <tr><td colspan="3" style="text-align:center;">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Configurações do Firebase (Substitua pelas suas credenciais)
    const firebaseConfig = {
        databaseURL: "https://SEU-PROJECT-ID.firebaseio.com"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Utilitários de URL
    const urlParams = new URLSearchParams(window.location.search);
    const sensorID = urlParams.get('id') || 'SENSOR_02';

    document.getElementById('tituloSensor').innerText = `Histórico - ${sensorID}`;

    const elements = {
        listaHistorico: document.getElementById('listaHistorico')
    };

    const state = {
        sensorID: sensorID,
        globalData: [],
        chartInstance: null
    };

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    function mostrarSemDados() {
        elements.listaHistorico.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum registro encontrado para este período.</td></tr>';
    }

    function processarRegistro(chave, obj, periodo, agora, inicioHoje, seteDiasAtras) {
        let timestamp = Number(chave) || obj.timestamp || obj.ts;

        // Trata timestamp em segundos vs milissegundos
        if (timestamp < 10000000000) {
            timestamp = timestamp * 1000;
        }

        if (isNaN(timestamp)) return;

        // Filtro por período
        if (periodo === 'hoje' && timestamp < inicioHoje) return;
        if (periodo === '7dias' && timestamp < seteDiasAtras) return;

        const temp = obj.temp !== undefined ? obj.temp : obj.temperatura;
        const hum = obj.hum !== undefined ? obj.hum : obj.umidade;

        state.globalData.push({
            ts: timestamp,
            temp: temp !== undefined ? Number(temp) : null,
            hum: hum !== undefined ? Number(hum) : null
        });
    }

    async function fetchData(periodo = 'hoje') {
        elements.listaHistorico.innerHTML = '<tr><td colspan="3" style="text-align:center;">Sincronizando leituras...</td></tr>';
        state.globalData = [];

        if (state.chartInstance) {
            state.chartInstance.destroy();
            state.chartInstance = null;
        }

        try {
            const agora = new Date();
            const inicioHoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()).getTime();
            const seteDiasAtras = Date.now() - (7 * 24 * 60 * 60 * 1000);

            // Busca os dados do sensor
            const historicoSnap = await db.ref(`historico/${state.sensorID}`).once("value");

            if (!historicoSnap.exists()) return mostrarSemDados();

            const base = historicoSnap.val();

            // Varredura recursiva nas pastas de data (ex: diario/2026-04-18/TIMESTAMP)
            function varrerEProcessar(obj, chavePai = "") {
                if (!obj || typeof obj !== "object") return;

                if (obj.temp !== undefined || obj.temperatura !== undefined || obj.hum !== undefined) {
                    processarRegistro(chavePai, obj, periodo, agora, inicioHoje, seteDiasAtras);
                    return;
                }

                Object.keys(obj).forEach(chave => {
                    varrerEProcessar(obj[chave], chave);
                });
            }

            varrerEProcessar(base);

            // Ordena os registros do mais recente para o mais antigo e remove duplicados
            const mapaUnico = new Map();
            state.globalData.forEach(item => mapaUnico.set(`${item.ts}_${item.temp}_${item.hum}`, item));
            state.globalData = [...mapaUnico.values()].sort((a, b) => b.ts - a.ts);

            if (!state.globalData.length) return mostrarSemDados();

            renderUI();
            renderChart();
        } catch (error) {
            console.error(error);
            elements.listaHistorico.innerHTML = `
                <tr><td colspan="3"><div class="erro"><b>Erro ao carregar histórico:</b> ${escapeHtml(error.message)}</div></td></tr>
            `;
        }
    }

    function renderUI() {
        elements.listaHistorico.innerHTML = state.globalData.map(item => `
            <tr>
                <td>${new Date(item.ts).toLocaleString('pt-BR')}</td>
                <td>${item.temp !== null ? item.temp.toFixed(1) + ' °C' : '--'}</td>
                <td>${item.hum !== null ? item.hum.toFixed(1) + ' %' : '--'}</td>
            </tr>
        `).join('');
    }

    function renderChart() {
        const ctx = document.getElementById('historicoChart').getContext('2d');
        const dadosOrdenados = [...state.globalData].sort((a, b) => a.ts - b.ts);

        state.chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dadosOrdenados.map(d => new Date(d.ts)),
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: dadosOrdenados.map(d => d.temp),
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        tension: 0.3,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Umidade (%)',
                        data: dadosOrdenados.map(d => d.hum),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.3,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: { displayFormats: { hour: 'HH:mm', day: 'dd/MM' } },
                        grid: { color: '#334155' }
                    },
                    y: { position: 'left', title: { display: true, text: 'Temp (°C)' }, grid: { color: '#334155' } },
                    y1: { position: 'right', title: { display: true, text: 'Umidade (%)' }, grid: { drawOnChartArea: false } }
                }
            }
        });
    }

    function filtrar(periodo, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        fetchData(periodo);
    }

    function exportarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFontSize(16);
        doc.text(`Relatório de Histórico - ${state.sensorID}`, 14, 20);
        doc.setFontSize(10);
        doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 28);

        const rows = state.globalData.map(item => [
            new Date(item.ts).toLocaleString('pt-BR'),
            item.temp !== null ? `${item.temp.toFixed(1)} °C` : '--',
            item.hum !== null ? `${item.hum.toFixed(1)} %` : '--'
        ]);

        doc.autoTable({
            startY: 35,
            head: [['Data / Hora', 'Temperatura', 'Umidade']],
            body: rows
        });

        doc.save(`historico_${state.sensorID}.pdf`);
    }

    // Inicialização
    fetchData('hoje');
</script>

</body>
</html>

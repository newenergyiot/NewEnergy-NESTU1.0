<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Leituras - IoT Sensor</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- jsPDF & html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.min.js" integrity="sha512-BNaRQnYJYiPSqoxaitwrpyXY4abZF18fWGxyh5hvIRpMteTO8iM06Tf3dcda=" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --success: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-info h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border: none;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    /* Filters (Tabs) */
    .filter-tabs {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      width: fit-content;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* Chart Container */
    .chart-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 24px;
      position: relative;
      height: 350px;
    }

    /* Table & Grouping */
    .history-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
    }

    .date-group {
      margin-bottom: 24px;
    }

    .date-group-title {
      font-size: 1rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .history-table th {
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 10px 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-table td {
      padding: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .history-table tr.alert-row {
      background-color: var(--danger-bg);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-ok {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }

    .badge-alert {
      background: rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }

    /* Utility/States */
    .loading-state, .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .loading-spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-info">
        <h1 id="sensor-title"><i class="fa-solid fa-microchip"></i> Carregando Sensor...</h1>
        <p id="sensor-subtitle">Local: -- | Cliente: --</p>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="window.location.href='admin.html'">
          <i class="fa-solid fa-arrow-left"></i> Voltar
        </button>
        <button class="btn btn-primary" id="btn-export-pdf" onclick="exportToPDF()">
          <i class="fa-solid fa-file-pdf"></i> Exportar PDF
        </button>
      </div>
    </header>

    <div class="filter-tabs">
      <button class="tab-btn active" onclick="setFilter('hoje', this)">Hoje</button>
      <button class="tab-btn" onclick="setFilter('7dias', this)">7 Dias</button>
      <button class="tab-btn" onclick="setFilter('mes', this)">Este Mês</button>
      <button class="tab-btn" onclick="setFilter('ano', this)">Este Ano</button>
    </div>

    <!-- Gráfico -->
    <div class="chart-card">
      <canvas id="historyChart"></canvas>
    </div>

    <!-- Tabela de Histórico -->
    <div class="history-card">
      <div id="data-container">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>Buscando histórico no Firebase...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Script (v9 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // Insira a sua configuração do Firebase aqui
    const firebaseConfig = {
      apiKey: "SEU_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://SEU_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Variáveis Globais
    let sensorId = new URLSearchParams(window.location.search).get('id') || 'sensor_01';
    let rawReadings = [];
    let currentFilter = 'hoje';
    let historyChart = null;

    // Faixas de Alerta (Padrão)
    let limits = {
      tempMin: 15.0,
      tempMax: 25.0,
      humMin: 30.0,
      humMax: 70.0
    };

    // Inicialização
    window.addEventListener('DOMContentLoaded', async () => {
      await loadSensorMetadata();
      await fetchHistoryData();
      renderAll();
    });

    // 1. Carregar Metadados e Limites de Alerta
    async function loadSensorMetadata() {
      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, `central_sensores/${sensorId}`));
        
        if (snapshot.exists()) {
          const data = snapshot.val();
          document.getElementById('sensor-title').innerHTML = `<i class="fa-solid fa-microchip"></i> ${data.nome || sensorId}`;
          document.getElementById('sensor-subtitle').innerText = `Local: ${data.localizacao || 'N/A'} | Cliente: ${data.cliente || 'N/A'}`;
          
          if (data.tempMin !== undefined) limits.tempMin = parseFloat(data.tempMin);
          if (data.tempMax !== undefined) limits.tempMax = parseFloat(data.tempMax);
          if (data.humMin !== undefined) limits.humMin = parseFloat(data.humMin);
          if (data.humMax !== undefined) limits.humMax = parseFloat(data.humMax);
        } else {
          document.getElementById('sensor-title').innerHTML = `<i class="fa-solid fa-microchip"></i> ${sensorId}`;
        }
      } catch (err) {
        console.error("Erro ao carregar metadados:", err);
      }
    }

    // 2. Buscar Dados do Histórico com Fallback de Rotas
    async function fetchHistoryData() {
      const dbRef = ref(db);
      const pathsToTry = [
        `historico/${sensorId}`,
        `historico_diario/${sensorId}`,
        `leituras/${sensorId}`,
        `sensores/${sensorId}/historico`
      ];

      rawReadings = [];

      for (const path of pathsToTry) {
        try {
          const snapshot = await get(child(dbRef, path));
          if (snapshot.exists()) {
            const val = snapshot.val();
            parseFirebaseData(val);
            if (rawReadings.length > 0) break; // Sai se encontrou dados
          }
        } catch (e) {
          console.warn(`Falha na rota ${path}:`, e);
        }
      }

      // Ordenar por data (mais recente primeiro)
      rawReadings.sort((a, b) => b.timestamp - a.timestamp);
    }

    // Converter nós arbitrários em array padronizado
    function parseFirebaseData(data) {
      if (typeof data !== 'object' || !data) return;

      Object.keys(data).forEach(key => {
        const item = data[key];

        if (item && typeof item === 'object') {
          // Se for uma folha com dados de leitura
          if (item.temperatura !== undefined || item.temp !== undefined) {
            let ts = item.timestamp || item.dataHora || item.data;
            let dateObj = ts ? new Date(ts) : new Date();

            if (isNaN(dateObj.getTime()) && typeof key === 'string') {
              // Tenta parsear a chave se for timestamp
              dateObj = new Date(isNaN(key) ? key : parseInt(key));
            }

            rawReadings.push({
              timestamp: isNaN(dateObj.getTime()) ? Date.now() : dateObj.getTime(),
              dataObj: isNaN(dateObj.getTime()) ? new Date() : dateObj,
              temperatura: parseFloat(item.temperatura ?? item.temp ?? 0),
              umidade: parseFloat(item.umidade ?? item.hum ?? 0)
            });
          } else {
            // Se for sub-nó (ex: agrupado por data), recursão
            parseFirebaseData(item);
          }
        }
      });
    }

    // 3. Filtrar Dados pelo Período
    function getFilteredData() {
      const now = new Date();
      return rawReadings.filter(item => {
        const d = item.dataObj;
        if (currentFilter === 'hoje') {
          return d.toDateString() === now.toDateString();
        } else if (currentFilter === '7dias') {
          const diffDays = (now - d) / (1000 * 60 * 60 * 24);
          return diffDays <= 7;
        } else if (currentFilter === 'mes') {
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        } else if (currentFilter === 'ano') {
          return d.getFullYear() === now.getFullYear();
        }
        return true;
      });
    }

    // 4. Renderizar Tela (Gráfico + Tabela)
    function renderAll() {
      const data = getFilteredData();
      renderChart(data);
      renderTable(data);
    }

    window.setFilter = function(filterName, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      currentFilter = filterName;
      renderAll();
    };

    // 5. Renderizar Gráfico
    function renderChart(data) {
      const ctx = document.getElementById('historyChart').getContext('2d');
      const sortedAsc = [...data].sort((a, b) => a.timestamp - b.timestamp);

      const labels = sortedAsc.map(i => {
        return i.dataObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + 
               ' ' + i.dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      });

      const temps = sortedAsc.map(i => i.temperatura);
      const hums = sortedAsc.map(i => i.umidade);

      if (historyChart) {
        historyChart.destroy();
      }

      historyChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Temperatura (°C)',
              data: temps,
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: labels.length > 50 ? 0 : 3
            },
            {
              label: 'Umidade (%)',
              data: hums,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: labels.length > 50 ? 0 : 3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f8fafc' } }
          },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    // 6. Renderizar Tabela Agrupada por Data
    function renderTable(data) {
      const container = document.getElementById('data-container');

      if (data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 8px;"></i>
            <p>Nenhuma leitura encontrada para o período selecionado.</p>
          </div>`;
        return;
      }

      // Agrupar por data (DD/MM/YYYY)
      const groups = {};
      data.forEach(item => {
        const dateKey = item.dataObj.toLocaleDateString('pt-BR');
        if (!groups[dateKey]) groups[dateKey] = [];
        groups[dateKey].push(item);
      });

      let html = '';
      Object.keys(groups).forEach(dateStr => {
        html += `
          <div class="date-group">
            <div class="date-group-title">
              <i class="fa-regular fa-calendar-days"></i> ${dateStr}
            </div>
            <table class="history-table">
              <thead>
                <tr>
                  <th>Hora</th>
                  <th>Temperatura</th>
                  <th>Umidade</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>`;

        groups[dateStr].forEach(row => {
          const timeStr = row.dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          
          const isTempAlert = row.temperatura < limits.tempMin || row.temperatura > limits.tempMax;
          const isHumAlert = row.umidade < limits.humMin || row.umidade > limits.humMax;
          const isAlert = isTempAlert || isHumAlert;

          html += `
            <tr class="${isAlert ? 'alert-row' : ''}">
              <td>${timeStr}</td>
              <td style="${isTempAlert ? 'color: var(--danger); font-weight: bold;' : ''}">
                ${row.temperatura.toFixed(1)} °C
              </td>
              <td style="${isHumAlert ? 'color: var(--danger); font-weight: bold;' : ''}">
                ${row.umidade.toFixed(1)} %
              </td>
              <td>
                ${isAlert 
                  ? '<span class="badge badge-alert"><i class="fa-solid fa-triangle-exclamation"></i> ALERTA</span>' 
                  : '<span class="badge badge-ok"><i class="fa-solid fa-check"></i> Normal</span>'}
              </td>
            </tr>`;
        });

        html += `
              </tbody>
            </table>
          </div>`;
      });

      container.innerHTML = html;
    }

    // 7. Exportar em PDF usando jsPDF + html2canvas
    window.exportToPDF = async function() {
      const btn = document.getElementById('btn-export-pdf');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Gerando PDF...`;

      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const element = document.querySelector('.container');

        const canvas = await html2canvas(element, {
          scale: 2,
          backgroundColor: '#0f172a'
        });

        const imgData = canvas.toDataURL('image/png');
        const imgWidth = 210; 
        const pageHeight = 297; 
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight;
        let position = 0;

        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;

        while (heightLeft >= 0) {
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }

        pdf.save(`historico_${sensorId}_${new Date().toISOString().slice(0,10)}.pdf`);
      } catch (err) {
        console.error("Erro ao gerar PDF:", err);
        alert("Falha ao gerar PDF. Verifique o console.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> Exportar PDF`;
      }
    };
  </script>
</body>
</html>

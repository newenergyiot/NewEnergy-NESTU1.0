<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central NewEnergy</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>

<body class="bg-slate-50 font-sans min-h-screen">

<header class="bg-white border-b p-5 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">CENTRAL NEWENERGY</h1>
            <p class="text-sm text-blue-600">Monitoramento Geral</p>
        </div>

        <div class="flex items-center gap-4">
            <span id="status" class="text-sm text-slate-500">
                ● Conectando...
            </span>

            <button onclick="abrirModal()"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl">
                + Novo Sensor
            </button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto p-6">

    <div id="sensores"
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>

</main>


<!-- MODAL -->
<div id="modal"
     class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl p-6 w-full max-w-md">

        <div class="flex justify-between mb-5">
            <h2 id="titulo" class="text-lg font-bold">
                Novo Sensor
            </h2>

            <button onclick="fecharModal()"
                    class="text-slate-500">
                Cancelar
            </button>
        </div>

        <form onsubmit="salvar(event)" class="space-y-3">

            <input id="id"
                required
                placeholder="SENSOR_02"
                class="campo">

            <input id="nome"
                required
                placeholder="Local / Equipamento"
                class="campo">

            <input id="cliente"
                required
                placeholder="Nome do Cliente"
                class="campo">

            <input id="temp"
                required
                placeholder="Rota temperatura: sensores/SENSOR_02/temp"
                class="campo">

            <input id="hum"
                required
                placeholder="Rota umidade: sensores/SENSOR_02/hum"
                class="campo">

            <input id="seen"
                required
                placeholder="Rota last_seen: sensores/SENSOR_02/last_seen"
                class="campo">

            <button id="salvarBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">
                Salvar Sensor
            </button>

        </form>
    </div>
</div>


<style>
.campo{
    width:100%;
    box-sizing:border-box;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:11px 14px;
    outline:none;
}
.campo:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px #bfdbfe;
}
</style>


<script>

/* =====================================================
   FIREBASE - NOVO PROJETO
   ===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyAHF7mVM9Yv71cnqG-C1_P7MfEj1hc6_Bs",
  authDomain: "nestu-02.firebaseapp.com",
  databaseURL: "https://nestu-02-default-rtdb.firebaseio.com",
  projectId: "nestu-02",
  storageBucket: "nestu-02.firebasestorage.app",
  messagingSenderId: "440418278168",
  appId: "1:440418278168:web:15c519eb00200a33435c6d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let editando = false;
let sensorEditando = null;


/* =====================================================
   CARREGAR TODOS OS SENSORES
   ===================================================== */

db.ref("central_sensores").on("value", snapshot => {

    const container = document.getElementById("sensores");

    container.innerHTML = "";

    if (!snapshot.exists()) {

        container.innerHTML =
            `<p class="text-slate-500 col-span-full text-center">
                Nenhum sensor cadastrado.
            </p>`;

        document.getElementById("status").textContent =
            "● Nenhum sensor";

        return;
    }

    document.getElementById("status").textContent =
        "● Sistema conectado";

    snapshot.forEach(item => {

        const id = item.key;
        const sensor = item.val();

        criarCard(id, sensor);

    });

});


/* =====================================================
   CRIAR CARD
   ===================================================== */

function criarCard(id, sensor){

    const container = document.getElementById("sensores");

    const card = document.createElement("div");

    card.id = `card-${id}`;

    card.className =
        "bg-white rounded-2xl border border-slate-200 shadow-sm p-5";

    card.innerHTML = `

        <div class="flex justify-between">

            <div>
                <p class="text-xs text-slate-400 font-bold">
                    ${id}
                </p>

                <h2 class="text-lg font-bold text-slate-800">
                    ${sensor.nome || "Sensor"}
                </h2>

                <p class="text-xs text-slate-500">
                    Cliente: ${sensor.clientID || "-"}
                </p>
            </div>

            <div class="flex gap-2">

                <button onclick="editar('${id}')"
                    class="bg-slate-100 px-2 py-1 rounded">
                    ✏️
                </button>

                <button onclick="excluir('${id}')"
                    class="bg-slate-100 px-2 py-1 rounded">
                    🗑️
                </button>

            </div>

        </div>


        <div class="grid grid-cols-2 gap-3 mt-5">

            <div class="bg-slate-50 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-500">
                    Temperatura
                </p>

                <strong id="temp-${id}"
                    class="text-2xl text-slate-800">
                    -- °C
                </strong>
            </div>


            <div class="bg-slate-50 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-500">
                    Umidade
                </p>

                <strong id="hum-${id}"
                    class="text-2xl text-slate-800">
                    -- %
                </strong>
            </div>

        </div>


        <div class="flex justify-between items-center mt-4
                    pt-3 border-t">

            <span id="online-${id}"
                class="text-sm text-slate-500">
                ● Offline
            </span>

            <span id="seen-${id}"
                class="text-xs text-slate-500">
                --
            </span>

        </div>


        <a href="painel.html?id=${id}"
           target="_blank"
           class="block text-center bg-blue-50 text-blue-600
                  font-bold rounded-xl py-3 mt-4">

            Ver Painel Detalhado

        </a>
    `;

    container.appendChild(card);


    /* TEMPERATURA */

    if(sensor.rotaTemp){

        db.ref(sensor.rotaTemp).on("value", snap => {

            const valor = Number(snap.val());

            const elemento =
                document.getElementById(`temp-${id}`);

            if(!isNaN(valor))
                elemento.textContent =
                    valor.toFixed(1) + " °C";

        });

    }


    /* UMIDADE */

    if(sensor.rotaHum){

        db.ref(sensor.rotaHum).on("value", snap => {

            const valor = Number(snap.val());

            const elemento =
                document.getElementById(`hum-${id}`);

            if(!isNaN(valor))
                elemento.textContent =
                    valor.toFixed(1) + " %";

        });

    }


    /* LAST SEEN */

    if(sensor.rotaLastSeen){

        db.ref(sensor.rotaLastSeen).on("value", snap => {

            atualizarOnline(
                id,
                snap.val()
            );

        });

    }

}


/* =====================================================
   ONLINE / OFFLINE
   ===================================================== */

function atualizarOnline(id, timestamp){

    if(!timestamp) return;

    const segundos =
        Math.floor(Date.now()/1000) - Number(timestamp);

    const online = segundos < 60;

    const elemento =
        document.getElementById(`online-${id}`);

    const hora =
        document.getElementById(`seen-${id}`);

    if(online){

        elemento.textContent = "● Online";
        elemento.className =
            "text-sm text-emerald-600 font-bold";

    }else{

        elemento.textContent = "● Offline";
        elemento.className =
            "text-sm text-rose-600 font-bold";

    }

    hora.textContent =
        new Date(timestamp * 1000)
        .toLocaleTimeString("pt-BR");

}


/* =====================================================
   NOVO SENSOR
   ===================================================== */

function abrirModal(){

    editando = false;
    sensorEditando = null;

    document.getElementById("titulo").textContent =
        "Novo Sensor";

    document.querySelector("form").reset();

    document.getElementById("id").disabled = false;

    document.getElementById("modal")
        .classList.remove("hidden");
}


/* =====================================================
   FECHAR
   ===================================================== */

function fecharModal(){

    document.getElementById("modal")
        .classList.add("hidden");

}


/* =====================================================
   EDITAR
   ===================================================== */

function editar(id){

    db.ref(`central_sensores/${id}`)
      .once("value")
      .then(snapshot => {

        const s = snapshot.val();

        editando = true;
        sensorEditando = id;

        document.getElementById("titulo").textContent =
            "Editar " + id;

        document.getElementById("id").value = id;
        document.getElementById("id").disabled = true;

        document.getElementById("nome").value =
            s.nome || "";

        document.getElementById("cliente").value =
            s.clientID || "";

        document.getElementById("temp").value =
            s.rotaTemp || "";

        document.getElementById("hum").value =
            s.rotaHum || "";

        document.getElementById("seen").value =
            s.rotaLastSeen || "";

        document.getElementById("modal")
            .classList.remove("hidden");

      });

}


/* =====================================================
   SALVAR
   ===================================================== */

function salvar(event){

    event.preventDefault();

    const id =
        document.getElementById("id")
        .value.trim()
        .toUpperCase()
        .replace(/\s+/g,"_");

    const dados = {

        nome:
            document.getElementById("nome").value.trim(),

        clientID:
            document.getElementById("cliente").value.trim(),

        rotaTemp:
            document.getElementById("temp").value.trim(),

        rotaHum:
            document.getElementById("hum").value.trim(),

        rotaLastSeen:
            document.getElementById("seen").value.trim()

    };


    db.ref(`central_sensores/${id}`)
      .set(dados)
      .then(() => {

          alert(
              editando
              ? "Sensor atualizado!"
              : "Sensor cadastrado!"
          );

          fecharModal();

      })
      .catch(error => {

          console.error(error);

          alert(
              "Erro ao salvar. Verifique as regras do Firebase."
          );

      });

}


/* =====================================================
   EXCLUIR
   ===================================================== */

function excluir(id){

    if(!confirm(`Excluir ${id}?`))
        return;

    db.ref(`central_sensores/${id}`)
      .remove()
      .then(() => {

          alert("Sensor removido.");

      })
      .catch(error => {

          console.error(error);

          alert("Erro ao excluir.");

      });

}

</script>

</body>
</html>

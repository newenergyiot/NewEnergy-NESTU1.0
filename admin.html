<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Sensores - NewEnergy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App (versão compatível com v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Painel de Monitoramento</h1>
                <p class="text-sm text-slate-500">NewEnergy - Gestão de Sensores</p>
            </div>
            <button onclick="abrirModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl transition-all shadow-sm">
                + Novo Sensor
            </button>
        </header>

        <!-- Grade de Sensores -->
        <div id="grid-sensores" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Os cards dos sensores serão injetados dinamicamente aqui -->
        </div>
    </div>

    <!-- Modal de Cadastro / Edição -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 border border-slate-200">
            <h2 id="titulo" class="text-xl font-bold text-slate-900 mb-4">Novo Sensor</h2>
            
            <form onsubmit="salvar(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ID do Sensor (Ex: SENSOR_1)</label>
                    <input type="text" id="id" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm uppercase">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome do Sensor / Ambiente</label>
                    <input type="text" id="nome" placeholder="Ex: Geladeira Vacinas 01" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Cliente / Local</label>
                    <input type="text" id="cliente" placeholder="Ex: Hospital Central" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Temp. Mínima (°C)</label>
                        <input type="number" step="0.1" id="tempMin" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Temp. Máxima (°C)</label>
                        <input type="number" step="0.1" id="tempMax" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Umidade Mínima (%)</label>
                        <input type="number" step="0.1" id="humMin" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Umidade Máxima (%)</label>
                        <input type="number" step="0.1" id="humMax" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail para Alerta</label>
                    <input type="email" id="emailAlerta" placeholder="exemplo@dominio.com" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Telefone / WhatsApp para Alerta</label>
                    <input type="text" id="telefoneAlerta" placeholder="(11) 99999-9999" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Freq. Registro (seg)</label>
                        <input type="number" id="freqRegistro" value="60" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Intervalo Alerta (min)</label>
                        <input type="number" id="intervaloAlerta" value="15" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Rota Firebase - Temperatura</label>
                    <input type="text" id="rotaTemp" placeholder="/temp" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Rota Firebase - Umidade</label>
                    <input type="text" id="rotaHum" placeholder="/hum" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Rota Firebase - Last Seen</label>
                    <input type="text" id="rotaLastSeen" placeholder="/last_seen" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="fecharModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-xl transition-all">Cancelar</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-xl transition-all">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuração do Firebase (Substitua com suas credenciais)
        const firebaseConfig = {
  apiKey: "AIzaSyAHF7mVM9Yv71cnqG-C1_P7MfEj1hc6_Bs",
  authDomain: "nestu-02.firebaseapp.com",
  databaseURL: "https://nestu-02-default-rtdb.firebaseio.com",
  projectId: "nestu-02",
  storageBucket: "nestu-02.firebasestorage.app",
  messagingSenderId: "440418278168",
  appId: "1:440418278168:web:15c519eb00200a33435c6d"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let listeners = {};
        let editando = false;
        let sensorEditando = null;

        // Inicializar escuta dos sensores cadastrados
        document.addEventListener("DOMContentLoaded", () => {
            carregarSensores();
        });

        function escapeAttr(str) {
            return String(str).replace(/[^a-zA-Z0-9_-]/g, "_");
        }

        function carregarSensores() {
            db.ref("central_sensores").on("value", snapshot => {
                const grid = document.getElementById("grid-sensores");
                grid.innerHTML = "";

                if (!snapshot.exists()) {
                    grid.innerHTML = `<p class="text-slate-500 col-span-full text-center py-8">Nenhum sensor cadastrado.</p>`;
                    return;
                }

                snapshot.forEach(childSnapshot => {
                    const id = childSnapshot.key;
                    const sensor = childSnapshot.val();
                    renderizarCardSensor(id, sensor);
                    ativarListenersSensor(id, sensor);
                });
            });
        }

        function renderizarCardSensor(id, sensor) {
            const safeId = escapeAttr(id);
            const grid = document.getElementById("grid-sensores");

            let card = document.getElementById(`card-${safeId}`);
            if (!card) {
                card = document.createElement("div");
                card.id = `card-${safeId}`;
                card.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between gap-4";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-bold text-slate-900 text-lg">${sensor.nome || id}</h3>
                                <p class="text-xs text-slate-500">${sensor.clientID || "Sem cliente"} • ID: ${id}</p>
                            </div>
                            <span id="online-${safeId}" class="text-sm text-slate-400 font-medium">● Verificando...</span>
                        </div>

                        <div class="grid grid-cols-2 gap-3 my-2">
                            <div id="box-temp-${safeId}" class="bg-slate-50 rounded-xl p-3 text-center border border-slate-100 transition-colors duration-300">
                                <span class="block text-xs text-slate-500 font-medium">Temperatura</span>
                                <span id="temp-${safeId}" class="text-xl font-bold text-slate-800">--°C</span>
                                <span id="status-email-temp-${safeId}" class="block text-[10px] text-slate-400 mt-1"></span>
                            </div>
                            <div id="box-hum-${safeId}" class="bg-slate-50 rounded-xl p-3 text-center border border-slate-100 transition-colors duration-300">
                                <span class="block text-xs text-slate-500 font-medium">Umidade</span>
                                <span id="hum-${safeId}" class="text-xl font-bold text-slate-800">--%</span>
                                <span id="status-email-hum-${safeId}" class="block text-[10px] text-slate-400 mt-1"></span>
                            </div>
                        </div>

                        <div class="text-xs text-slate-400 mt-2 flex justify-between">
                            <span>Último visto: <strong id="seen-${safeId}" class="text-slate-600">--:--:--</strong></span>
                            ${sensor.telefoneAlerta ? `<span>📱 WhatsApp configurado</span>` : ''}
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                        <button onclick="editar('${id}')" class="px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all">Configurar</button>
                        <button onclick="excluir('${id}')" class="px-3 py-1.5 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition-all">Excluir</button>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function ativarListenersSensor(id, sensor) {
            const safeId = escapeAttr(id);

            if (sensor.rotaTemp) {
                ouvirRota(sensor.rotaTemp, valor => {
                    const el = document.getElementById(`temp-${safeId}`);
                    if (el) el.textContent = valor !== null && !isNaN(valor) ? `${valor.toFixed(1)}°C` : "--°C";
                    verificarAlertaCaixas(id, sensor);
                });
            }

            if (sensor.rotaHum) {
                ouvirRota(sensor.rotaHum, valor => {
                    const el = document.getElementById(`hum-${safeId}`);
                    if (el) el.textContent = valor !== null && !isNaN(valor) ? `${valor.toFixed(1)}%` : "--%";
                    verificarAlertaCaixas(id, sensor);
                });
            }

            if (sensor.rotaLastSeen) {
                ouvirRota(sensor.rotaLastSeen, valor => {
                    atualizarOnline(id, valor);
                });
            }
        }

        function verificarAlertaCaixas(id, sensor, tempForcada = null, humForcada = null) {
            const safeId = escapeAttr(id);
            const tempEl = document.getElementById(`temp-${safeId}`);
            const humEl = document.getElementById(`hum-${safeId}`);
            const boxTemp = document.getElementById(`box-temp-${safeId}`);
            const boxHum = document.getElementById(`box-hum-${safeId}`);
            
            const statusEmailTemp = document.getElementById(`status-email-temp-${safeId}`);
            const statusEmailHum = document.getElementById(`status-email-hum-${safeId}`);

            let nomeSensor = sensor.nome || id;
            let emailDestino = sensor.emailAlerta;
            let intervaloMinutos = sensor.intervaloAlerta !== undefined && sensor.intervaloAlerta !== null ? Number(sensor.intervaloAlerta) : 15;
            let intervaloMs = intervaloMinutos * 60 * 1000;
            let agora = Date.now();

            let chavePushTemp = `push_enviado_${id}_temp`;
            let chavePushHum = `push_enviado_${id}_hum`;
            let chaveUltimoEmailTemp = `ultimo_envio_${id}_temp`;
            let chaveUltimoEmailHum = `ultimo_envio_${id}_hum`;

            if (tempEl && boxTemp) {
                let textoTemp = tempEl.textContent.replace("°C", "").trim();
                const tempVal = tempForcada !== null ? tempForcada : parseFloat(textoTemp);
                
                if (!isNaN(tempVal)) {
                    const abaixoMin = sensor.tempMin !== undefined && sensor.tempMin !== null && tempVal < sensor.tempMin;
                    const acimaMax = sensor.tempMax !== undefined && sensor.tempMax !== null && tempVal > sensor.tempMax;

                    if (abaixoMin || acimaMax) {
                        boxTemp.className = "bg-[#fff1f2] rounded-xl p-3 text-center border border-rose-300 transition-colors duration-300";
                        
                        let pushJaEnviado = localStorage.getItem(chavePushTemp) === "true";
                        if (!pushJaEnviado) {
                            localStorage.setItem(chavePushTemp, "true");
                            dispararNotificacaoLocal(
                                `🚨 Alerta de Temperatura: ${nomeSensor}`,
                                `O sensor ${id} registrou ${tempVal.toFixed(1)}°C (Fora da faixa!).`
                            );
                        }

                        let ultimoTempo = parseInt(localStorage.getItem(chaveUltimoEmailTemp)) || 0;
                        let proximoPermitido = ultimoTempo + intervaloMs;

                        if (agora - ultimoTempo > intervaloMs) {
                            localStorage.setItem(chaveUltimoEmailTemp, agora);
                            dispararEmailAlerta(emailDestino, nomeSensor, "Temperatura Anormal", tempVal.toFixed(1) + "°C");
                            if (statusEmailTemp) statusEmailTemp.textContent = "✉️ E-mail enviado agora!";
                        } else {
                            let tempoRestanteMs = proximoPermitido - agora;
                            let minutosRestantes = Math.ceil(tempoRestanteMs / (60 * 1000));
                            if (statusEmailTemp) {
                                statusEmailTemp.textContent = `⏳ Próximo e-mail em ~${minutosRestantes} min`;
                            }
                        }
                    } else {
                        boxTemp.className = "bg-slate-50 rounded-xl p-3 text-center border border-slate-100 transition-colors duration-300";
                        localStorage.setItem(chavePushTemp, "false");
                        
                        let ultimoTempo = parseInt(localStorage.getItem(chaveUltimoEmailTemp)) || 0;
                        if (ultimoTempo > 0 && agora - ultimoTempo < intervaloMs) {
                            let tempoRestanteMs = (ultimoTempo + intervaloMs) - agora;
                            let minutosRestantes = Math.ceil(tempoRestanteMs / (60 * 1000));
                            if (statusEmailTemp) {
                                statusEmailTemp.textContent = `⏳ Bloqueado por mais ~${minutosRestantes} min`;
                            }
                        } else {
                            localStorage.removeItem(chaveUltimoEmailTemp);
                            if (statusEmailTemp) statusEmailTemp.textContent = "";
                        }
                    }
                }
            }

            if (humEl && boxHum) {
                let textoHum = humEl.textContent.replace("%", "").trim();
                const humVal = humForcada !== null ? humForcada : parseFloat(textoHum);
                
                if (!isNaN(humVal)) {
                    const abaixoMin = sensor.humMin !== undefined && sensor.humMin !== null && humVal < sensor.humMin;
                    const acimaMax = sensor.humMax !== undefined && sensor.humMax !== null && humVal > sensor.humMax;

                    if (abaixoMin || acimaMax) {
                        boxHum.className = "bg-[#fff1f2] rounded-xl p-3 text-center border border-rose-300 transition-colors duration-300";
                        
                        let pushJaEnviado = localStorage.getItem(chavePushHum) === "true";
                        if (!pushJaEnviado) {
                            localStorage.setItem(chavePushHum, "true");
                            dispararNotificacaoLocal(
                                `🚨 Alerta de Umidade: ${nomeSensor}`,
                                `O sensor ${id} registrou ${humVal.toFixed(1)}% (Fora da faixa!).`
                            );
                        }

                        let ultimoTempo = parseInt(localStorage.getItem(chaveUltimoEmailHum)) || 0;
                        let proximoPermitido = ultimoTempo + intervaloMs;

                        if (agora - ultimoTempo > intervaloMs) {
                            localStorage.setItem(chaveUltimoEmailHum, agora);
                            dispararEmailAlerta(emailDestino, nomeSensor, "Umidade Anormal", humVal.toFixed(1) + "%");
                            if (statusEmailHum) statusEmailHum.textContent = "✉️ E-mail enviado agora!";
                        } else {
                            let tempoRestanteMs = proximoPermitido - agora;
                            let minutosRestantes = Math.ceil(tempoRestanteMs / (60 * 1000));
                            if (statusEmailHum) {
                                statusEmailHum.textContent = `⏳ Próximo e-mail em ~${minutosRestantes} min`;
                            }
                        }
                    } else {
                        boxHum.className = "bg-slate-50 rounded-xl p-3 text-center border border-slate-100 transition-colors duration-300";
                        localStorage.setItem(chavePushHum, "false");
                        
                        let ultimoTempo = parseInt(localStorage.getItem(chaveUltimoEmailHum)) || 0;
                        if (ultimoTempo > 0 && agora - ultimoTempo < intervaloMs) {
                            let tempoRestanteMs = (ultimoTempo + intervaloMs) - agora;
                            let minutosRestantes = Math.ceil(tempoRestanteMs / (60 * 1000));
                            if (statusEmailHum) {
                                statusEmailHum.textContent = `⏳ Bloqueado por mais ~${minutosRestantes} min`;
                            }
                        } else {
                            localStorage.removeItem(chaveUltimoEmailHum);
                            if (statusEmailHum) statusEmailHum.textContent = "";
                        }
                    }
                }
            }
        }

        function ouvirRota(rota, callback) {
            if (!rota) return;
            const rotaLimpa = normalizarRota(rota);
            const ref = db.ref(rotaLimpa);

            ref.on("value", snapshot => {
                const valor = Number(snapshot.val());
                callback(valor);
            });

            listeners[rotaLimpa] = ref;
        }

        function normalizarRota(rota) {
            if (!rota) return "";
            rota = String(rota).trim();
            if (rota.startsWith("/")) rota = rota.substring(1);
            return rota;
        }

        function atualizarOnline(id, timestamp) {
            if (!Number.isFinite(Number(timestamp))) return;
            let ts = Number(timestamp);
            if (ts > 100000000000) ts = Math.floor(ts / 1000);

            const segundos = Math.floor(Date.now() / 1000) - ts;
            const online = segundos >= 0 && segundos < 60;

            const elemento = document.getElementById(`online-${id}`);
            const hora = document.getElementById(`seen-${id}`);

            if (!elemento) return;

            if (online) {
                elemento.textContent = "● Online";
                elemento.className = "text-sm text-emerald-600 font-bold";
            } else {
                elemento.textContent = "● Offline";
                elemento.className = "text-sm text-rose-600 font-bold";
            }

            if (hora) {
                hora.textContent = new Date(ts * 1000).toLocaleTimeString("pt-BR");
            }
        }

        function dispararNotificacaoLocal(titulo, corpo) {
            if (Notification.permission === "granted") {
                new Notification(titulo, { body: corpo });
            }
        }

        function dispararEmailAlerta(email, sensor, tipo, valor) {
            console.log(`Disparando e-mail para ${email} sobre ${sensor}: ${tipo} (${valor})`);
            // Implementação de envio de e-mail via API/Backend se houver
        }

        function abrirModal() {
            editando = false;
            sensorEditando = null;
            document.getElementById("titulo").textContent = "Novo Sensor";
            document.querySelector("form").reset();
            const campoId = document.getElementById("id");
            campoId.disabled = false;
            campoId.oninput = sugerirRotas;
            document.getElementById("modal").classList.remove("hidden");
        }

        function sugerirRotas() {
            if (editando) return;
            const valor = document.getElementById("id").value.trim().toUpperCase();
            const resultado = valor.match(/^SENSOR_(\d+)$/);
            if (!resultado) return;

            const numero = Number(resultado[1]);
            if (numero === 1) {
                document.getElementById("rotaTemp").value = "/temp";
                document.getElementById("rotaHum").value = "/hum";
                document.getElementById("rotaLastSeen").value = "/last_seen";
            } else {
                document.getElementById("rotaTemp").value = `/temp${numero}`;
                document.getElementById("rotaHum").value = `/hum${numero}`;
                document.getElementById("rotaLastSeen").value = `/last_seen${numero}`;
            }
        }

        function fecharModal() {
            document.getElementById("modal").classList.add("hidden");
        }

        function editar(id) {
            db.ref(`central_sensores/${id}`).once("value").then(snapshot => {
                if (!snapshot.exists()) {
                    alert("Sensor não encontrado.");
                    return;
                }

                const s = snapshot.val();
                editando = true;
                sensorEditando = id;

                document.getElementById("titulo").textContent = "Painel de Serviço: " + id;
                const campoId = document.getElementById("id");
                campoId.value = id;
                campoId.disabled = true;
                campoId.oninput = null;

                document.getElementById("nome").value = s.nome || "";
                document.getElementById("cliente").value = s.clientID || "";
                document.getElementById("tempMin").value = s.tempMin !== undefined && s.tempMin !== null ? s.tempMin : "";
                document.getElementById("tempMax").value = s.tempMax !== undefined && s.tempMax !== null ? s.tempMax : "";
                document.getElementById("humMin").value = s.humMin !== undefined && s.humMin !== null ? s.humMin : "";
                document.getElementById("humMax").value = s.humMax !== undefined && s.humMax !== null ? s.humMax : "";
                document.getElementById("emailAlerta").value = s.emailAlerta || "";
                document.getElementById("telefoneAlerta").value = s.telefoneAlerta || "";
                document.getElementById("freqRegistro").value = s.freqRegistro || "";
                document.getElementById("intervaloAlerta").value = s.intervaloAlerta || "";
                document.getElementById("rotaTemp").value = s.rotaTemp || "";
                document.getElementById("rotaHum").value = s.rotaHum || "";
                document.getElementById("rotaLastSeen").value = s.rotaLastSeen || "";

                document.getElementById("modal").classList.remove("hidden");
            }).catch(error => {
                console.error(error);
                alert("Erro ao carregar dados do sensor.");
            });
        }

        function salvar(event) {
            event.preventDefault();
            const id = document.getElementById("id").value.trim().toUpperCase().replace(/\s+/g, "_");

            const dados = {
                nome: document.getElementById("nome").value.trim(),
                clientID: document.getElementById("cliente").value.trim(),
                tempMin: parseFloat(document.getElementById("tempMin").value) || null,
                tempMax: parseFloat(document.getElementById("tempMax").value) || null,
                humMin: parseFloat(document.getElementById("humMin").value) || null,
                humMax: parseFloat(document.getElementById("humMax").value) || null,
                emailAlerta: document.getElementById("emailAlerta").value.trim(),
                telefoneAlerta: document.getElementById("telefoneAlerta").value.trim(),
                freqRegistro: parseInt(document.getElementById("freqRegistro").value) || 60,
                intervaloAlerta: parseInt(document.getElementById("intervaloAlerta").value) || 15,
                rotaTemp: document.getElementById("rotaTemp").value.trim(),
                rotaHum: document.getElementById("rotaHum").value.trim(),
                rotaLastSeen: document.getElementById("rotaLastSeen").value.trim()
            };

            db.ref(`central_sensores/${id}`).update(dados).then(() => {
                alert(editando ? "Configurações atualizadas!" : "Sensor cadastrado!");
                fecharModal();
            }).catch(error => {
                console.error(error);
                alert("Erro ao salvar alterações no Firebase.");
            });
        }

        function excluir(id) {
            if (!confirm(`Deseja excluir permanentemente o ${id}?`)) return;

            db.ref(`central_sensores/${id}`).remove().then(() => {
                alert("Sensor removido com sucesso.");
            }).catch(error => {
                console.error(error);
                alert("Erro ao excluir.");
            });
        }
    </script>
</body>
</html>

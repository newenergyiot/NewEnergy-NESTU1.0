<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Sensor de Temperatura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <!-- Firebase App (versão compatível com SDK antigo / CDN) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Painel Administrativo</h1>
                <p class="text-sm text-slate-500">Gerenciamento de Sensores e Alerta (NewEnergy)</p>
            </div>
            <a href="index.html" class="mt-4 sm:mt-0 bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition-colors">
                Ver Monitoramento
            </a>
        </header>

        <main class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-6 text-slate-900">Configurações dos Sensores</h2>

            <div id="lista-sensores" class="space-y-6">
                <!-- Os campos dos sensores serão carregados dinamicamente aqui -->
                <p class="text-slate-500 text-sm">Carregando sensores...</p>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-200 flex justify-end">
                <button onclick="salvarConfiguracoes()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-xl transition-colors shadow-sm">
                    Salvar Alterações
                </button>
            </div>
        </main>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            databaseURL: "https://newenergy-temp-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        let dadosSensoresGlobais = {};

        // Carrega os sensores do Firebase ao iniciar a página
        function carregarSensoresAdmin() {
            const ref = db.ref('sensores');
            ref.on('value', (snapshot) => {
                const data = snapshot.val();
                dadosSensoresGlobais = data || {};
                renderizarFormularioSensores(dadosSensoresGlobais);
            }, (error) => {
                console.error("Erro ao carregar sensores:", error);
                document.getElementById('lista-sensores').innerHTML = `<p class="text-rose-500 text-sm">Erro ao carregar dados do banco.</p>`;
            });
        }

        function renderizarFormularioSensores(sensores) {
            const container = document.getElementById('lista-sensores');
            container.innerHTML = '';

            if (!sensores || Object.keys(sensores).length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-sm">Nenhum sensor cadastrado no banco.</p>`;
                return;
            }

            for (const [id, sensor] of Object.entries(sensores)) {
                const div = document.createElement('div');
                div.className = "bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4";
                
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700 text-base">ID do Sensor: ${id}</span>
                        <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-medium">Ativo</span>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Equipamento / Local</label>
                            <input type="text" id="nome-${id}" value="${sensor.nome || ''}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail para Alerta</label>
                            <input type="email" id="email-${id}" value="${sensor.emailAlerta || ''}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 pt-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Temp Mín (°C)</label>
                            <input type="number" step="0.1" id="tempMin-${id}" value="${sensor.tempMin !== undefined ? sensor.tempMin : ''}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Temp Máx (°C)</label>
                            <input type="number" step="0.1" id="tempMax-${id}" value="${sensor.tempMax !== undefined ? sensor.tempMax : ''}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Umi Mín (%)</label>
                            <input type="number" step="1" id="humMin-${id}" value="${sensor.humMin !== undefined ? sensor.humMin : ''}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Umi Máx (%)</label>
                            <input type="number" step="1" id="humMax-${id}" value="${sensor.humMax !== undefined ? sensor.humMax : ''}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Alerta (min)</label>
                            <input type="number" step="1" id="intervaloAlerta-${id}" value="${sensor.intervaloAlerta !== undefined ? sensor.intervaloAlerta : 15}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function salvarConfiguracoes() {
            const atualizacoes = {};

            for (const id of Object.keys(dadosSensoresGlobais)) {
                const nome = document.getElementById(`nome-${id}`).value;
                const emailAlerta = document.getElementById(`email-${id}`).value;
                const tempMin = document.getElementById(`tempMin-${id}`).value;
                const tempMax = document.getElementById(`tempMax-${id}`).value;
                const humMin = document.getElementById(`humMin-${id}`).value;
                const humMax = document.getElementById(`humMax-${id}`).value;
                const intervaloAlerta = document.getElementById(`intervaloAlerta-${id}`).value;

                atualizacoes[`sensores/${id}/nome`] = nome;
                atualizacoes[`sensores/${id}/emailAlerta`] = emailAlerta;
                atualizacoes[`sensores/${id}/tempMin`] = tempMin !== "" ? parseFloat(tempMin) : null;
                atualizacoes[`sensores/${id}/tempMax`] = tempMax !== "" ? parseFloat(tempMax) : null;
                atualizacoes[`sensores/${id}/humMin`] = humMin !== "" ? parseFloat(humMin) : null;
                atualizacoes[`sensores/${id}/humMax`] = humMax !== "" ? parseFloat(humMax) : null;
                atualizacoes[`sensores/${id}/intervaloAlerta`] = intervaloAlerta !== "" ? parseInt(intervaloAlerta) : 15;
            }

            db.ref().update(atualizacoes)
                .then(() => {
                    alert("Configurações salvas com sucesso!");
                })
                .catch((error) => {
                    console.error("Erro ao salvar:", error);
                    alert("Erro ao salvar as configurações. Verifique o console.");
                });
        }

        // Inicializar leitura
        window.onload = function() {
            carregarSensoresAdmin();
        };
    </script>
</body>
</html>
